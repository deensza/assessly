services:
  # ─── Database ─────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-assessly}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - assessly-net

  # ─── Flask Backend API ────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: assessly-backend
    ports:
      - "5001:5000"
    environment:
      - FLASK_ENV=development
      - SECRET_KEY=${SECRET_KEY}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - DATABASE_URL=${DATABASE_URL}
      - SANDBOX_TIME_LIMIT=${SANDBOX_TIME_LIMIT:-10}
      - SANDBOX_MEMORY_LIMIT=${SANDBOX_MEMORY_LIMIT:-256}
    volumes:
      - ./backend:/app
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      db:
        condition: service_healthy
      sandbox-python:
        condition: service_started
    restart: unless-stopped
    networks:
      - assessly-net

  # ─── Next.js Frontend ─────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: assessly-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:5001/api
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - assessly-net

  # ─── Sandbox Images (pre-built) ───────────────────────
  sandbox-python:
    build:
      context: ./docker/sandbox-python
    image: assessly-sandbox-python
    container_name: assessly-sandbox-python-build
    entrypoint: [ "echo", "Python sandbox image built successfully" ]
    networks:
      - assessly-net

  sandbox-java:
    build:
      context: ./docker/sandbox-java
    image: assessly-sandbox-java
    container_name: assessly-sandbox-java-build
    entrypoint: [ "echo", "Java sandbox image built successfully" ]
    networks:
      - assessly-net

  sandbox-c:
    build:
      context: ./docker/sandbox-c
    image: assessly-sandbox-c
    container_name: assessly-sandbox-c-build
    entrypoint: [ "echo", "C sandbox image built successfully" ]
    networks:
      - assessly-net

networks:
  assessly-net:
    driver: bridge

volumes:
  pgdata:
