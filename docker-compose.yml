version: '3.9'

services:
  # ─── Flask Backend API ────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: assessly-backend
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=development
      - SECRET_KEY=assessly-secret-key-dev
      - JWT_SECRET_KEY=assessly-jwt-secret-dev
      - DATABASE_URL=sqlite:///assessly.db
      - SANDBOX_TIME_LIMIT=10
      - SANDBOX_MEMORY_LIMIT=256
    volumes:
      - ./backend:/app
      - /var/run/docker.sock:/var/run/docker.sock  # For Docker-in-Docker sandbox
    depends_on:
      - sandbox-python
    restart: unless-stopped
    networks:
      - assessly-net

  # ─── Next.js Frontend ─────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: assessly-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:5000/api
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - assessly-net

  # ─── Sandbox Images (pre-built) ───────────────────────
  sandbox-python:
    build:
      context: ./docker/sandbox-python
    image: assessly-sandbox-python
    container_name: assessly-sandbox-python-build
    entrypoint: ["echo", "Python sandbox image built successfully"]

  sandbox-java:
    build:
      context: ./docker/sandbox-java
    image: assessly-sandbox-java
    container_name: assessly-sandbox-java-build
    entrypoint: ["echo", "Java sandbox image built successfully"]

  sandbox-c:
    build:
      context: ./docker/sandbox-c
    image: assessly-sandbox-c
    container_name: assessly-sandbox-c-build
    entrypoint: ["echo", "C sandbox image built successfully"]

networks:
  assessly-net:
    driver: bridge
